[package]
name = "flgit"
version = "0.1.0"
description = "FL Studio Version Control Companion"
authors = ["FLgit"]
edition = "2021"

[lib]
name = "flgit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "flgit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "5"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging"
] }

[dev-dependencies]
tempfile = "3"
